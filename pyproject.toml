[tool.poetry]
name = "aegis-ai-omni"
version = "2.0.0"
description = "Aegis-AI The Omni-Crisis Intelligence Swarm"
authors = ["Hamza Khan <hamza@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.111.0"
uvicorn = "^0.30.1"
firebase-admin = "^6.5.0"
google-cloud-firestore = "^2.16.0"
langgraph = "^0.1.1"
pydantic = "^2.7.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"
ruff = "^0.4.9"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
