name: aegis_admin
description: "Aegis-Omni Admin Web Command Center — Operator & Developer Intelligence Grid"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Typography & UI
  google_fonts: ^6.1.0

  # Firebase Infrastructure
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.0.0

  # Mapping Engine
  flutter_map: ^6.0.0
  latlong2: ^0.9.0

  # Utilities
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
